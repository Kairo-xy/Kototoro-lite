name: Kototoro Lite Android build

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify native libraries match ARM64 target
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No debug APK was produced.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Checking native libraries in $apk"
            native_entries="$(unzip -Z1 "$apk" | grep -E '^lib/[^/]+/[^/]+\.so$' || true)"
            if [[ -z "$native_entries" ]]; then
              echo "No packaged native libraries found in $apk."
              continue
            fi
            printf '%s\n' "$native_entries"
            unexpected="$(printf '%s\n' "$native_entries" | grep -v '^lib/arm64-v8a/' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected non-ARM64 native libraries found:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
          done
      - name: Summarize largest APK entries
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          for apk in "${apks[@]}"; do
            echo "Largest entries in $apk (uncompressed sizes):"
            unzip -l "$apk" | awk 'NF >= 4 && $1 ~ /^[0-9]+$/ { print $1 "\t" $4 }' | sort -nr | sed -n '1,30p'
            echo "Native library totals by ABI:"
            unzip -l "$apk" | awk 'NF >= 4 && $1 ~ /^[0-9]+$/ && $4 ~ /^lib\/[^/]+\/[^/]+\.so$/ { split($4,a,"/"); total[a[2]] += $1 } END { for (abi in total) printf "%s\t%d bytes\n", abi, total[abi] }' | sort
          done
      - name: Report APK size and checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No debug APK was produced.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            du -h "$apk"
            sha256sum "$apk"
          done
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kototoro-lite-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
