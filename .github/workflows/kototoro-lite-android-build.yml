name: Kototoro Lite Android build

# Build both variants so CI measures the installable, shrink-optimized release APK too.
# Debug and release compile in separate Gradle runs: compiling both at once exhausted the
# Kotlin compiler heap (OutOfMemoryError: GC overhead limit exceeded) on the CI runner.
# The release APK is signed when the RELEASE_* repository secrets exist; otherwise it stays unsigned.

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  assemble-apks:
    name: Assemble ARM64 debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --no-parallel :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kototoro-lite-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Prepare release signing (if secrets are set)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${STORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo 'Signing secrets are not available; the release APK will be unsigned.'
            exit 0
          fi
          keystore="$RUNNER_TEMP/kototoro-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          keytool -list -keystore "$keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$keystore"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo 'Release signing configured.'
      - name: Assemble minified release APK
        run: ./gradlew --no-daemon --no-parallel :app:assembleRelease
      - name: Verify native libraries match ARM64 target
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*arm64-v8a*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No debug or release APK was produced.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Checking native libraries in $apk"
            native_entries="$(unzip -Z1 "$apk" | grep -E '^lib/[^/]+/[^/]+\.so$' || true)"
            if [[ -z "$native_entries" ]]; then
              echo "No packaged native libraries found in $apk."
              continue
            fi
            printf '%s\n' "$native_entries"
            unexpected="$(printf '%s\n' "$native_entries" | grep -v '^lib/arm64-v8a/' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "Unexpected non-ARM64 native libraries found:" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
          done
      - name: Summarize largest APK entries
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*arm64-v8a*.apk)
          for apk in "${apks[@]}"; do
            echo "Largest entries in $apk (uncompressed sizes):"
            unzip -l "$apk" | awk 'NF >= 4 && $1 ~ /^[0-9]+$/ { print $1 "\t" $4 }' | sort -nr | sed -n '1,30p'
            echo "Native library totals by ABI:"
            unzip -l "$apk" | awk 'NF >= 4 && $1 ~ /^[0-9]+$/ && $4 ~ /^lib\/[^/]+\/[^/]+\.so$/ { split($4,a,"/"); total[a[2]] += $1 } END { for (abi in total) printf "%s\t%d bytes\n", abi, total[abi] }' | sort
          done
      - name: Report APK size and checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*arm64-v8a*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo 'No debug APK was produced.' >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "APK: $apk"
            du -h "$apk"
            sha256sum "$apk"
          done
      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kototoro-lite-arm64-release
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 7
