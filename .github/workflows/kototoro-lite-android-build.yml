name: Kototoro Lite Android build

on:
  push:
    branches:
      - devel
      - chatgpt/kototoro-lite-first-pass
  pull_request:
    branches:
      - devel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the obsolete `tools` package.
          # Install platform-tools explicitly; Gradle resolves the project's SDK platforms/build-tools.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Report APK size and checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( \${#apks[@]} == 0 )); then
            echo 'No debug APK was produced.' >&2
            exit 1
          fi
          for apk in \"\${apks[@]}\"; do
            echo \"APK: $apk\"
            du -h \"$apk\"
            sha256sum \"$apk\"
          done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kototoro-lite-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
