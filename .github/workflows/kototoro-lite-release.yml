name: Kototoro Lite release

# Builds the signed ARM64 release APK and attaches it to a GitHub Release.
# - Push a tag like `lite-v0.1.0` to publish from that commit, or
# - run manually from the Actions tab and enter a tag name
#   (manual runs only appear in the UI once this file is on the default branch).
# Requires the RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and
# RELEASE_KEY_PASSWORD repository secrets. The `lite-v*` prefix keeps this separate from
# the upstream `v*` release workflows.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. lite-v0.1.0)'
        required: true
        default: 'lite-v0.1.0'
  push:
    tags:
      - 'lite-v*'

permissions:
  contents: write

jobs:
  publish-apk:
    name: Build and publish signed ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${STORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo 'Missing signing secrets. Add RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD.' >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/kototoro-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          keytool -list -keystore "$keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$keystore"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Assemble signed release APK
        run: ./gradlew --no-daemon --no-parallel :app:assembleRelease
      - name: Prepare release files
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one release APK, found ${#apks[@]}: ${apks[*]:-none}" >&2
            exit 1
          fi
          if [[ "${apks[0]}" == *unsigned* ]]; then
            echo "Release APK is unsigned: ${apks[0]}" >&2
            exit 1
          fi
          mkdir -p release-files
          cp "${apks[0]}" "release-files/kototoro-lite-${TAG}-arm64.apk"
          (cd release-files && sha256sum ./*.apk | tee SHA256SUMS.txt)
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kototoro Lite $TAG" \
            --notes "ARM64 release build of Kototoro Lite, signed with the project's own key. Installs as org.skepsun.kototoro (the same id as the original app, so it will not install over a copy signed with a different key). SHA-256 checksum is in SHA256SUMS.txt." \
            --prerelease
