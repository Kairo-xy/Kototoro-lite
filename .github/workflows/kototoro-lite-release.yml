name: Kototoro Lite release

# Builds the signed ARM64 release APK and attaches it to a GitHub Release.
# Ways to start it:
# - Create a release in the GitHub UI with a NEW tag such as `lite-v0.1.0` (publishing creates the tag), or
# - push a tag named `lite-v*`, or
# - push a branch named `release/lite-v*` (the part after `release/` becomes the tag), or
# - run manually from the Actions tab and enter a tag name
#   (manual runs only appear in the UI once this file is on the default branch).
# If a release for the tag already exists the signed APK is attached to it; otherwise a DRAFT pre-release is
# created, which only the repository owner can see until it is published from the Releases page.
# Requires the RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and
# RELEASE_KEY_PASSWORD repository secrets. The `lite-v*` prefix keeps this separate from
# the upstream `v*` release workflows.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. lite-v0.1.0)'
        required: true
        default: 'lite-v0.1.0'
  push:
    tags:
      - 'lite-v*'
    branches:
      - 'release/lite-v*'

permissions:
  contents: write

jobs:
  publish-apk:
    name: Build and publish signed ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Resolve release tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "branch" ]]; then
            tag="${REF_NAME#release/}"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^lite-v[0-9A-Za-z._-]+$ ]]; then
            echo "Refusing to publish: '$tag' is not a lite-v* tag name." >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Release tag: $tag"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${STORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo 'Missing signing secrets. Add RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD.' >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/kototoro-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          keytool -list -keystore "$keystore" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$keystore"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Assemble signed release APK
        run: ./gradlew --no-daemon --no-parallel :app:assembleRelease
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one release APK, found ${#apks[@]}: ${apks[*]:-none}" >&2
            exit 1
          fi
          if [[ "${apks[0]}" == *unsigned* ]]; then
            echo "Release APK is unsigned: ${apks[0]}" >&2
            exit 1
          fi
          mkdir -p release-files
          cp "${apks[0]}" "release-files/kototoro-lite-${TAG}-arm64.apk"
          (cd release-files && sha256sum ./*.apk | tee SHA256SUMS.txt)
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # The release already exists (for example created in the GitHub UI); attach the signed APK to it.
            gh release upload "$TAG" release-files/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-files/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Kototoro Lite $TAG" \
              --notes "ARM64 release build of Kototoro Lite, signed with the project's own key. Installs as org.skepsun.kototoro.lite, next to the original Kototoro. SHA-256 checksum is in SHA256SUMS.txt." \
              --prerelease \
              --draft
          fi
