// Novel reader models and algorithms shared by the Android reader and the native iOS reader
// (docs/architecture/ios-novel-reader-sharing-research-2026-10.md): chapter document blocks, paragraph
// splitting, image placeholders, translation models, page line ranges and reader modes. Pure Kotlin;
// text measurement, rendering, storage and resources stay in the platforms. Tests live in commonTest so the
// regular expressions are also checked on Kotlin/Native.
plugins {
	id 'org.jetbrains.kotlin.multiplatform'
}

kotlin {
	jvm {
		compilerOptions {
			jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
		}
	}
	iosArm64()
	iosSimulatorArm64()

	sourceSets {
		getByName('commonTest') {
			dependencies {
				implementation kotlin('test')
			}
		}
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
}
